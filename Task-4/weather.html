<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vapor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: "#efe8dd",
                        forest: "#1f3d36",
                        sage: "#5f7a70",
                        leaf: "#3f6b5c",
                        sand: "#d9d0c1",
                        peach: "#d98c6a",
                        clay: "#a8502f",
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>

<body class="min-h-screen bg-cream font-sans text-forest">
    <div class="mx-auto max-w-5xl px-5 py-3 sm:px-8">

        <header class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3">
            <a href="index.html" class="text-xl font-medium">Vapor</a>
            <div class="flex w-full items-center gap-6 sm:w-auto sm:gap-12">
                <form id="search-form" role="search"
                    class="flex w-full max-w-xs border-b border-forest focus-within:border-leaf">
                    <label for="city-input" class="sr-only">City name</label>
                    <input id="city-input" type="text" placeholder="Enter city/country name" autocomplete="off"
                        class="flex-1 bg-transparent py-1.5 text-forest placeholder:text-sage focus:outline-none" />
                    <button type="submit" aria-label="Search"
                        class="pl-3 text-sage hover:text-forest focus-visible:outline focus-visible:outline-2 focus-visible:outline-leaf">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>
                <div class="flex items-center gap-9">
                    <a href="index.html"
                        class="flex shrink-0 items-center gap-2 text-sm text-sage hover:text-forest focus-visible:outline focus-visible:outline-2 focus-visible:outline-leaf">
                        <i class="fa-solid fa-arrow-left"></i>Back to home
                    </a>
                </div>
            </div>
        </header>

        <p id="status-message" role="status" class="my-2 min-h-5"></p>

        <main id="weather-section" class="hidden">
            <section id="hero-banner"
                class="relative flex min-h-40 items-end justify-between bg-sage bg-cover bg-center p-5 text-white sm:min-h-44 sm:p-6">
                <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
                <i id="hero-icon" class="fa-solid absolute left-5 top-5 text-2xl sm:left-6 sm:top-6"></i>
                <div class="relative">
                    <p id="current-temperature" class="text-5xl font-light leading-none sm:text-6xl"></p>
                    <h1 id="city-name" class="mt-1 text-base"></h1>
                </div>
                <div class="relative text-right">
                    <p id="hero-sunset" class="text-lg font-semibold"></p>
                    <p class="text-sm">Sunset time</p>
                </div>
            </section>

            <div class="mt-5 grid gap-6 md:grid-cols-[1fr_1.7fr]">
                <dl>
                    <div class="flex items-center justify-between border-t border-sand py-2.5 text-sm">
                        <dt class="text-sage"><i
                                class="fa-solid fa-temperature-half mr-3 w-5 text-center text-peach"></i>Feels like</dt>
                        <dd id="feels-like" class="font-semibold"></dd>
                    </div>
                    <div class="flex items-center justify-between border-t border-sand py-2.5 text-sm">
                        <dt class="text-sage"><i
                                class="fa-solid fa-droplet mr-3 w-5 text-center text-peach"></i>Humidity</dt>
                        <dd id="humidity" class="font-semibold"></dd>
                    </div>
                    <div class="flex items-center justify-between border-t border-sand py-2.5 text-sm">
                        <dt class="text-sage"><i class="fa-solid fa-wind mr-3 w-5 text-center text-peach"></i>Wind speed
                        </dt>
                        <dd id="wind-speed" class="font-semibold"></dd>
                    </div>
                    <div class="flex items-center justify-between border-t border-sand py-2.5 text-sm">
                        <dt class="text-sage"><i class="fa-solid fa-sun mr-3 w-5 text-center text-peach"></i>UV index
                        </dt>
                        <dd id="uv-index" class="font-semibold"></dd>
                    </div>
                    <div class="flex items-center justify-between border-t border-sand py-2.5 text-sm">
                        <dt class="text-sage"><i
                                class="fa-solid fa-circle-arrow-up mr-3 w-5 text-center text-peach"></i>Sunrise</dt>
                        <dd id="sunrise-time" class="font-semibold"></dd>
                    </div>
                    <div class="flex items-center justify-between border-y border-sand py-2.5 text-sm">
                        <dt class="text-sage"><i
                                class="fa-solid fa-circle-arrow-down mr-3 w-5 text-center text-peach"></i>Sunset</dt>
                        <dd id="sunset-time" class="font-semibold"></dd>
                    </div>
                </dl>

                <div>
                    <div class="flex gap-6 border-b border-sand text-sm">
                        <button data-chart-metric="temperature"
                            class="-mb-px border-b-2 border-leaf pb-1.5 text-forest">Temperature</button>
                        <button data-chart-metric="precipitation"
                            class="-mb-px border-b-2 border-transparent pb-1.5 text-sage">Precipitation</button>
                        <button data-chart-metric="wind"
                            class="-mb-px border-b-2 border-transparent pb-1.5 text-sage">Wind</button>
                    </div>
                    <div class="relative mt-3 h-36">
                        <canvas id="hourly-chart" aria-label="Hourly chart for today"></canvas>
                    </div>

                    <ul id="forecast-list" class="mt-4 grid grid-cols-7 border-t border-sand"></ul>
                </div>
            </div>
        </main>
    </div>

    <script src="weather.js"></script>
</body>

</html>
